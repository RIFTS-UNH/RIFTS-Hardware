site_name: RIFTS HDA

theme:
  name: material

docs_dir: docs

plugins:
  - glightbox

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md

  - RF-Shielded Enclosures:
      - RFSoC 4x2 Portable Field Enclosure: 
        - Overview: hardware/rfsoc-4x2/overview.md
        - Media: hardware/rfsoc-4x2/media.md

      - ZCU216 Rack-Mounted Enclosure:
        - Overview: hardware/zcu216/overview.md
        - Media: hardware/zcu216/media.md
      
  - Antenna Systems:
      - OmniLOG PRO 1030 N Antenna Mount:
        - Overview: antenna/nav_2/antenna-overview.md
        - Manufacturing Details: antenna/nav_2/antenna-manufacturing-details.md
        - Media: antenna/nav_2/antenna-media.md


  - Supporting Hardware:
    - Cooling Air Ducts & Fans: hardware/ventilation/air-ducts.md
    - TPU Corner Pads: hardware/tpu-pads/corner-pads-overview.md
      # - Overview: hardware/tpu-pads/corner-pads-overview.md
      # - Photo Gallery: hardware/tpu-pads/corner-pads-gallery.md
      # - Media: hardware/tpu-pads/corner-pads-media.md
    - RF Pathway CAD Model: hardware/rfsoc-4x2-rf-pathway.md

  - Electronics Reference CAD Models: electronics-cads/electronics-reference-cad-models.md

  # '<span style="font-weight: 800; color: #ff0000;">Media</span>'